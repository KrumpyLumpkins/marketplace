name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_MARKETPLACE_CHAIN_ID: SN_MAIN
      MARKETPLACE_API_URL: http://127.0.0.1:3100

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release tree hygiene
        run: pnpm release:check

      - name: Railway environment configuration
        run: pnpm railway:check

      - name: Production dependency audit
        run: pnpm release:audit

      - name: Native backend tests
        run: pnpm backend:test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: SDK interface tests and packed consumers
        run: |
          pnpm sdk:test
          pnpm sdk:pack:test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit and Storybook tests with coverage
        run: pnpm test:coverage

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Upload component workbench
        uses: actions/upload-artifact@v4
        with:
          name: storybook-${{ github.run_id }}
          path: storybook-static
          retention-days: 7

      - name: Build
        run: pnpm build

      - name: E2E tests
        run: pnpm test:e2e

      - name: Resolve app page files
        id: app_pages
        run: |
          APP_PAGE_FILES="$(git ls-files src/app | grep '/page.tsx$' || true)"
          {
            echo "files<<EOF"
            echo "$APP_PAGE_FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve screenshot routes
        id: screenshot_routes
        env:
          CHANGED_FILES: ${{ steps.app_pages.outputs.files }}
        run: pnpm run ci:feature-routes

      - name: Capture feature screenshots
        env:
          SCREENSHOT_ROUTES_JSON: ${{ steps.screenshot_routes.outputs.routes_json }}
        run: pnpm run test:e2e:screenshots

      - name: Upload feature screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-screenshots-${{ github.run_id }}
          path: artifacts/feature-screenshots
          if-no-files-found: ignore

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: 2.15.1
      - uses: foundry-rs/setup-snfoundry@v6.0.0
        with:
          starknet-foundry-version: 0.64.1
      - uses: software-mansion/setup-universal-sierra-compiler@v1
        with:
          universal-sierra-compiler-version: 2.10.2
      - run: node scripts/contracts/test.mjs
      - run: scarb fmt --check && scarb build
        working-directory: contracts/marketplace
